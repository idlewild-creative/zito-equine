<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | ZITO Equine</title>
  <meta name="description" content="Breeding inquiries and contact information for ZITO Equine.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a href="/" class="logo"><img src="/images/logo-zito-equine.png" alt="ZITO Equine"></a>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false">&#9776;</button>
      <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/stallions/">Stallions</a>
        <a href="/#about">About</a>
        <a href="/#media">Media</a>
        <a href="/breeding.html">Breeding</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="section">
      <div class="wrap narrow">
        <h1>Breeding Inquiry</h1>
        <form name="breeding-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="form">
          <p hidden><label>Leave blank <input name="bot-field"></label></p>
          <label>Name <input type="text" name="name" required></label>
          <label>Email <input type="email" name="email" required></label>
          <label>Phone <input type="tel" name="phone"></label>
          <label>Stallion of interest <input type="text" name="stallion"></label>
          <label>Mare info (name, breed, registration) <textarea name="mare" rows="3"></textarea></label>
          <label>Message <textarea name="message" rows="5"></textarea></label>
          <button type="submit" class="btn">Send Inquiry</button>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>Owned by David Zito &middot; 208.599.0811 &middot; <a href="mailto:info@zitoequine.com">info@zitoequine.com</a></p>
      <p>&copy; <span id="year"></span> ZITO Equine. All rights reserved.</p>
    </div>
  </footer>
  <script src="/js/main.js"></script>
</body>
</html>
